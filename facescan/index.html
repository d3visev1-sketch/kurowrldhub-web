<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face Scan Proof — MediaPipe + Kalidokit → VRM</title>
<style>
  :root{ --bg:#0b0e13; --panel:#141a22; --line:#243040; --text:#eaf2ff; --muted:#9fb2c8; --cyan:#37e1ff; --mint:#57e6b0; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
  header{padding:14px 18px;border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .wrap{display:flex;flex-wrap:wrap;gap:16px;padding:16px;align-items:flex-start}
  .stage{position:relative;width:min(420px,92vw);aspect-ratio:3/4;background:linear-gradient(#1a2634,#0d141c);
         border:1px solid var(--line);border-radius:16px;overflow:hidden}
  #three{width:100%;height:100%;display:block}
  #cam{position:absolute;right:10px;bottom:10px;width:120px;border-radius:10px;border:1px solid var(--line);
       transform:scaleX(-1);background:#000}
  .side{flex:1;min-width:260px}
  button{background:var(--cyan);color:#04222b;border:0;border-radius:12px;padding:12px 18px;font-weight:800;
         font-size:15px;cursor:pointer}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
  .bar{height:8px;background:#0c1219;border-radius:6px;overflow:hidden;margin:6px 0}
  .bar > i{display:block;height:100%;background:var(--mint);width:0}
  code{color:var(--cyan)}
  .log{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);white-space:pre-wrap;
       background:#0c1219;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.6/lib/three-vrm.module.min.js"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.umd.js"></script>
</head>
<body>
<header>
  <h1>🪞 Face-scan proof — MediaPipe + Kalidokit → VRM avatar</h1>
  <div class="sub">Webcam → face tracking → drives a free anime VRM avatar live. No signup, no paid service.</div>
</header>
<div class="wrap">
  <div class="stage">
    <canvas id="three"></canvas>
    <video id="cam" autoplay playsinline muted class="hide"></video>
  </div>
  <div class="side">
    <div class="row">
      <button id="enable">Enable camera</button>
      <button id="reset" class="ghost">Recenter</button>
    </div>
    <div class="stat">
      <div>Head turn <span id="headv" style="color:var(--cyan)">–</span></div>
      <div class="bar"><i id="blinkbar"></i></div>
      <div style="font-size:12px;color:var(--muted)">blink</div>
      <div class="bar"><i id="mouthbar"></i></div>
      <div style="font-size:12px;color:var(--muted)">mouth open</div>
    </div>
    <div class="stat">
      <b>Status</b>
      <div class="log" id="log">booting…</div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const logEl = document.getElementById("log");
const lines = [];
function log(m){ lines.push(m); logEl.textContent = lines.join("\n"); logEl.scrollTop = logEl.scrollHeight; console.log("[facescan]", m); }
window.addEventListener("error", e => log("ERROR: " + (e.message || e)));

// ---- three.js scene -------------------------------------------------------
const canvas = document.getElementById("three");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
function resize(){ const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 3/4, 0.1, 20);
camera.position.set(0, 1.35, 1.6);
const cam3 = new THREE.Vector3(0, 1.35, 0);
scene.add(new THREE.AmbientLight(0xffffff, 1.4));
const dir = new THREE.DirectionalLight(0xffffff, 1.6); dir.position.set(1, 2, 2); scene.add(dir);
resize(); window.addEventListener("resize", resize);
log("three.js ready ✓");

let currentVrm = null, headBone = null;
new GLTFLoader()
  .register(p => new VRMLoaderPlugin(p))
  .load("avatar.vrm",
    (gltf) => {
      const vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.rotateVRM0(vrm);            // VRM0 faces -Z; turn to face camera
      currentVrm = vrm;
      headBone = vrm.humanoid.getNormalizedBoneNode("head");
      scene.add(vrm.scene);
      log("VRM avatar loaded ✓ (sample anime model)");
    },
    (p) => { if(p.total) log("loading VRM… " + Math.round(p.loaded/p.total*100) + "%"); },
    (err) => log("VRM load FAILED: " + err)
  );

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  camera.lookAt(cam3);
  if (currentVrm) currentVrm.update(dt);
  renderer.render(scene, camera);
}
animate();

// ---- MediaPipe FaceLandmarker --------------------------------------------
let faceLandmarker = null;
async function initFace(){
  log("loading MediaPipe face model…");
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
    runningMode: "VIDEO", numFaces: 1,
    outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true
  });
  log("MediaPipe FaceLandmarker ready ✓");
  log("Kalidokit present: " + (!!window.Kalidokit ? "yes ✓" : "NO"));
}
initFace().catch(e => log("MediaPipe init FAILED: " + e));

// ---- webcam + per-frame solve --------------------------------------------
const video = document.getElementById("cam");
const headv = document.getElementById("headv");
const blinkbar = document.getElementById("blinkbar");
const mouthbar = document.getElementById("mouthbar");
let running = false;
const S = { hx:0, hy:0, hz:0, blink:0, aa:0 };   // smoothed state
const lerp = (a,b,t)=>a+(b-a)*t;

document.getElementById("enable").onclick = async () => {
  if (!faceLandmarker){ log("face model still loading, try again in a moment"); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:640, height:480 }, audio:false });
    video.srcObject = stream; video.classList.remove("hide");
    await video.play();
    running = true; log("camera on — mirroring your face ✓"); loop();
  } catch(err){ log("camera unavailable (" + (err && err.name || err) + ") — this proof needs a real webcam"); }
};
document.getElementById("reset").onclick = ()=>{ S.hx=S.hy=S.hz=0; };

function loop(){
  if (!running) return;
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  const res = faceLandmarker.detectForVideo(video, performance.now());
  if (!res || !res.faceLandmarks || !res.faceLandmarks.length) return;
  const lm = res.faceLandmarks[0];
  const rig = window.Kalidokit.Face.solve(lm, { runtime:"mediapipe", video, smoothBlink:true });
  if (!rig) return;
  // head rotation (Kalidokit degrees->radians already in .head.x/y/z as radians)
  S.hx = lerp(S.hx, rig.head.x, 0.4);
  S.hy = lerp(S.hy, rig.head.y, 0.4);
  S.hz = lerp(S.hz, rig.head.z, 0.4);
  const blink = 1 - Math.min(rig.eye.l, rig.eye.r);   // eye.l/r ~1 open, ~0 closed
  const aa = rig.mouth.shape.A;
  S.blink = lerp(S.blink, blink, 0.5);
  S.aa = lerp(S.aa, aa, 0.5);
  if (headBone){ headBone.rotation.set(S.hx, -S.hy, -S.hz); }
  if (currentVrm && currentVrm.expressionManager){
    const em = currentVrm.expressionManager;
    em.setValue("blink", S.blink);
    em.setValue("aa", S.aa);
    em.setValue("ih", rig.mouth.shape.I || 0);
    em.setValue("ou", rig.mouth.shape.U || 0);
    em.setValue("ee", rig.mouth.shape.E || 0);
    em.setValue("oh", rig.mouth.shape.O || 0);
  }
  headv.textContent = (S.hy*57.3).toFixed(0) + "°";
  blinkbar.style.width = (S.blink*100).toFixed(0) + "%";
  mouthbar.style.width = (Math.min(S.aa,1)*100).toFixed(0) + "%";
}
</script>
</body>
</html>
